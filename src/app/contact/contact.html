<div class="contact-container">
  <div class="contact-card">
    <h1>Contactez-nous</h1>
    <p class="subtitle">Une question sur une conférence ou un partenariat ? Écrivez-nous !</p>

    @if (envoye()) {
      <div class="success-alert">
        Merci {{ name() }} ! Votre message a bien été envoyé. Nous vous répondrons dans les plus brefs délais.
      </div>
    } @else {
      <form (ngSubmit)="envoyer()">
        <div class="form-group">
          <label for="c-name">Nom :</label>
          <input
            id="c-name"
            type="text"
            placeholder="Votre nom"
            [ngModel]="name()"
            (ngModelChange)="name.set($event)"
            name="name"
            required
          />
        </div>

        <div class="form-group">
          <label for="c-email">Email :</label>
          <input
            id="c-email"
            type="email"
            placeholder="votre.email@domaine.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required
          />
        </div>

        <div class="form-group">
          <label for="c-message">Message :</label>
          <textarea
            id="c-message"
            rows="5"
            placeholder="Écrivez votre message ici..."
            [ngModel]="message()"
            (ngModelChange)="message.set($event)"
            name="message"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-primary">Envoyer le message</button>
      </form>
    }
  </div>
</div>
